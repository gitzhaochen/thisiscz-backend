# fly.toml app configuration file generated for thisiscz-backend on 2026-07-24T04:36:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thisiscz-backend'
primary_region = 'iad'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://0.0.0.0:8080'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
